name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - run: chmod +x gradlew
      - run: ./gradlew test --no-daemon

  configurator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/configurator
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/configurator/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run lint
      - run: npm test

  tooling-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: node --test tools/tests/*.test.mjs

  generated-service-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: chmod +x gradlew
      - run: node --test tools/tests/generated-build/*.test.mjs

  load-test-contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: load-tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: corepack enable
      - run: corepack prepare pnpm@11.10.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm frontend:check

  frontend-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: corepack enable
      - run: corepack prepare pnpm@11.10.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm web:e2e:install
      - run: pnpm web:e2e

  oidc-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: corepack enable
      - run: corepack prepare pnpm@11.10.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm web:e2e:install
      - run: chmod +x gradlew
      - run: node tools/e2e/run-oidc-e2e.mjs

  frontend-image-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: corepack enable
      - run: corepack prepare pnpm@11.10.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm web:e2e:install
      - run: pnpm --filter @myprojecttemplate/web exec playwright install --with-deps firefox
      - run: chmod +x gradlew
      - run: node tools/e2e/run-frontend-image-smoke.mjs

  compose-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: >-
          docker compose
          --env-file infra/.env.versions
          -f infra/compose.yml
          --profile database-ha
          --profile cache
          --profile messaging
          --profile search
          --profile identity
          --profile observability
          --profile frontend
          config --quiet
