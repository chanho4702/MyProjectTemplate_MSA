server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: __SERVICE_NAME__
  # __OPTIONAL_CONFIG_IMPORTS__
  lifecycle:
    timeout-per-shutdown-phase: 20s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

platform:
  datasource:
    enabled: true
    pool:
      maximum-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
  web:
    request-id-header: X-Request-Id

management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
