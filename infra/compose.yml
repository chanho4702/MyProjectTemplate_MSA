name: msa-platform-template

services:
  postgres:
    image: ${POSTGRES_IMAGE}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app-local-password}
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - hot_standby=on
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-5432}:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/primary/init:/docker-entrypoint-initdb.d:ro
      - ./postgres/primary/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  postgres-reader:
    profiles: [database-ha]
    image: ${POSTGRES_IMAGE}
    environment:
      PGDATA: /var/lib/postgresql/data
      PGPASSWORD: replicator-local-password
      PRIMARY_HOST: postgres
      REPLICATION_USER: replicator
    entrypoint: [/bin/bash, /opt/platform/reader-entrypoint.sh]
    ports:
      - 127.0.0.1:${POSTGRES_READER_PORT:-5434}:5432
    volumes:
      - postgres_reader_data:/var/lib/postgresql/data
      - ./postgres/reader/reader-entrypoint.sh:/opt/platform/reader-entrypoint.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${REPLICATION_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    profiles: [cache]
    image: ${REDIS_IMAGE}
    command: [redis-server, --appendonly, "yes", --save, "60", "1"]
    ports:
      - 127.0.0.1:${REDIS_PORT:-6379}:6379
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  kafka:
    profiles: [messaging]
    image: ${KAFKA_IMAGE}
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: INTERNAL://:29092,CONTROLLER://:29093,HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://localhost:${KAFKA_PORT:-9092}
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - 127.0.0.1:${KAFKA_PORT:-9092}:9092
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  elasticsearch:
    profiles: [search]
    image: ${ELASTICSEARCH_IMAGE}
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.license.self_generated.type: basic
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    ports:
      - 127.0.0.1:${ELASTICSEARCH_PORT:-9200}:9200
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 40
    restart: unless-stopped

  keycloak:
    profiles: [identity]
    image: ${KEYCLOAK_IMAGE}
    command: [start-dev, --import-realm]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-local-password
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: ${POSTGRES_USER:-app}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-app-local-password}
      KC_HEALTH_ENABLED: "true"
    ports:
      - 127.0.0.1:${KEYCLOAK_PORT:-8180}:8080
    volumes:
      - ./keycloak/realm-template.json:/opt/keycloak/data/import/realm-template.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "exec 3<>/dev/tcp/127.0.0.1/9000; echo -e 'GET /health/ready HTTP/1.1\r\nhost: localhost\r\nConnection: close\r\n\r\n' >&3; grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 40
    restart: unless-stopped

  web:
    profiles: [frontend]
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    image: msa-platform-web:local
    volumes:
      - ./frontend/app-config.local.json:/etc/msa-web/app-config.json:ro
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://127.0.0.1:8080/healthz >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  frontend-ingress:
    profiles: [frontend]
    image: ${CAPACITY_PROXY_IMAGE}
    environment:
      FRONTEND_WEB_ORIGIN: http://web:8080
      FRONTEND_GATEWAY_ORIGIN: http://host.docker.internal:${GATEWAY_PORT:-8080}
    ports:
      - 127.0.0.1:${FRONTEND_INGRESS_PORT:-8090}:8080
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./frontend/ingress.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      web:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://127.0.0.1:8080/ingress-health | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  prometheus:
    profiles: [observability]
    image: ${PROMETHEUS_IMAGE}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-7d}
    ports:
      - 127.0.0.1:${PROMETHEUS_PORT:-9090}:9090
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped

  grafana:
    profiles: [observability]
    image: ${GRAFANA_IMAGE}
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-grafana-local-password}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    ports:
      - 127.0.0.1:${GRAFANA_PORT:-3001}:3000
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped

  capacity-proxy:
    profiles: [capacity-ha]
    image: ${CAPACITY_PROXY_IMAGE}
    ports:
      - 127.0.0.1:${CAPACITY_PROXY_PORT:-8084}:8080
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./capacity/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://127.0.0.1:8080/proxy-health | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  postgres_data:
  postgres_reader_data:
  redis_data:
  kafka_data:
  elasticsearch_data:
  prometheus_data:
  grafana_data:
