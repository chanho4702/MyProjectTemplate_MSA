server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: sample-service
              uri: ${SAMPLE_SERVICE_URI:${platform.gateway.sample-service-uri}}
              predicates:
                - Path=/api/v1/items/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: sampleService

platform:
  gateway:
    security-enabled: ${GATEWAY_SECURITY_ENABLED:false}

management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

resilience4j:
  circuitbreaker:
    instances:
      sampleService:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
