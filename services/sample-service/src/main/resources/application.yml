server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

spring:
  application:
    name: sample-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

platform:
  web:
    request-id-header: X-Request-Id
  datasource:
    enabled: true
    pool:
      maximum-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout-ms: ${DB_CONNECTION_TIMEOUT_MS:3000}
  redis:
    enabled: ${REDIS_ENABLED:false}
    key-prefix: ${spring.application.name}
  kafka:
    enabled: ${KAFKA_ENABLED:false}
    source: ${spring.application.name}
  search:
    enabled: ${SEARCH_ENABLED:false}
    index-prefix: ${SEARCH_INDEX_PREFIX:sample}
  observability:
    enabled: ${OBSERVABILITY_ENABLED:true}

management:
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  tracing:
    sampling:
      probability: ${TRACING_SAMPLE_PROBABILITY:0.1}
